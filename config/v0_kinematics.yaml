# =============================================================================
# DEVOTICS ARM V0 — Kinematics Solver Configuration
# =============================================================================
# Uses the Orocos KDL (Kinematics and Dynamics Library) plugin.
# KDL solves numerical IK iteratively from tool0 back to base_link.
# =============================================================================
arm_v0:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5
