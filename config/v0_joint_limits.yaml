# =============================================================================
# DEVOTICS ARM V0 — Joint Velocity and Acceleration Limits
# =============================================================================
# Used by MoveIt's Time-Optimal Trajectory Generation (TOTG) algorithm.
# MG90S servo rotational speed: ~0.10s / 60° ≈ 1.0 rad/s
# =============================================================================
joint_limits:
  base_joint:
    has_velocity_limits: true
    max_velocity: 1.5           # rad/s (~85 deg/s)
    has_acceleration_limits: true
    max_acceleration: 2.0       # rad/s^2

  shoulder_joint:
    has_velocity_limits: true
    max_velocity: 1.5           # rad/s
    has_acceleration_limits: true
    max_acceleration: 2.0       # rad/s^2

  elbow_joint:
    has_velocity_limits: true
    max_velocity: 1.5           # rad/s
    has_acceleration_limits: true
    max_acceleration: 2.0       # rad/s^2

  gripper_joint:
    has_velocity_limits: true
    max_velocity: 1.0           # rad/s
    has_acceleration_limits: true
    max_acceleration: 2.0       # rad/s^2
